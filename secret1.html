<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Story Just For You</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-red: #4a0404;
            --text-white: #fdfdfd;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--text-white);
            font-family: 'Didot', 'Playfair Display', serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Container where petals will safely fall without stretching the screen view */
        #petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Let clicks pass right through it */
            z-index: 1;
            overflow: hidden; 
        }

        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease-out;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Floating Petals Effect */
        .petal {
            position: absolute;
            background-color: #ff4d6d;
            border-radius: 150% 0 150% 0;
            opacity: 0.3;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        h2 { font-size: 2.5rem; font-weight: 300; letter-spacing: 2px; }
        .gold-text { color: var(--gold); font-style: italic; }

        /* The Final Question Styling */
        #final-stage {
            background: radial-gradient(circle, #2a0202 0%, #000 100%);
        }

        .decision-box {
            border: 1px solid var(--gold);
            padding: 50px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .btn-wrap {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .choice-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #yes-btn:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 20px var(--gold);
        }

        #no-btn { opacity: 0.6; font-size: 0.8rem; transition: transform 0.3s ease, opacity 0.3s ease; }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
    </style>
</head>
<body>

    <!-- Target overlay wrapper for the petals -->
    <div id="petal-container"></div>

    <!-- Section 1 -->
    <section>
        <div class="fade-in">
            <h2>Some things are <span class="gold-text">inevitable</span>.</h2>
            <p>Keep scrolling...</p>
        </div>
        <div class="scroll-hint">↓ Scroll</div>
    </section>

    <!-- Section 2 -->
    <section>
        <div class="fade-in">
            <h2>Like the way a conversation with you<br>becomes the <span class="gold-text">highlight</span> of my day.</h2>
        </div>
    </section>

    <!-- Section 3 -->
    <section>
        <div class="fade-in">
            <h2>I realized that "friend" is a beautiful word...<br>but I think <span class="gold-text">mine</span> sounds better.</h2>
        </div>
    </section>

    <!-- Section 4: The Reveal -->
    <section id="final-stage">
        <div class="fade-in decision-box">
            <h2>Will you be my <span class="gold-text">girlfriend</span>?</h2>
            <div class="btn-wrap">
                <button class="choice-btn" id="yes-btn">Yes</button>
                <button class="choice-btn" id="no-btn">No</button>
            </div>
        </div>
    </section>

    <script>
        // Force browser to always jump back to the top of the page on refresh
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // 1. Scroll Fade-in Logic
        const observerOptions = { threshold: 0.5 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

        // 2. Petal Rain Logic
        const container = document.getElementById('petal-container');
        
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 15 + 10 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            container.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 200);

        // 3. The "No" button interaction
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');

        noBtn.addEventListener('mouseover', () => {
            noBtn.style.transform = `scale(${Math.random() * 0.5})`;
            noBtn.style.opacity = '0.2';
            yesBtn.style.transform = 'scale(1.2)';
        });

        yesBtn.addEventListener('click', () => {
            document.querySelector('.decision-box').innerHTML = `
                <h1 style="color:var(--gold); font-size: 3rem;">FINALLY. ❤️</h1>
                
            `;
            // Trigger extra explosion of falling petals
            setInterval(createPetal, 50);
        });
    </script>
</body>
</html>
