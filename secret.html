<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Encrypted Message...</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #00ff41; /* Matrix Green */
            --love: #ff2d55;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #terminal {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            border-radius: 5px;
        }

        .cursor { display: inline-block; width: 10px; height: 20px; background: var(--accent); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Step 2: The Proposal UI */
        #proposal {
            display: none;
            text-align: center;
            color: white;
        }

        .heart-loader {
            font-size: 50px;
            color: var(--love);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 0px var(--love); }
            50% { transform: scale(1.2); text-shadow: 0 0 20px var(--love); }
            100% { transform: scale(1); text-shadow: 0 0 0px var(--love); }
        }

        .btn-container {
            margin-top: 40px;
            position: relative;
            height: 200px;
        }

        button {
            padding: 15px 30px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: var(--love);
            color: white;
            z-index: 100;
        }

        #noBtn {
            background: #444;
            color: #888;
            position: absolute;
        }

        /* Success State */
        .hidden { display: none !important; }
        #finalMessage { font-size: 1.5rem; line-height: 1.6; }
        
    </style>
</head>
<body>

    <!-- Stage 1: Terminal Intro -->
    <div id="terminal">
        <div id="typewriter"></div>
        <span class="cursor" id="cursor"></span>
        <div id="inputArea" style="display:none; margin-top: 20px;">
            <span>ACCESS_CODE: </span>
            <input type="text" id="passcode" style="background:none; border:none; color:var(--accent); outline:none; font-family:inherit; font-size: 16px;" autofocus>
        </div>
    </div>

    <!-- Stage 2: The Proposal -->
    <div id="proposal">
        <div class="heart-loader">❤️</div>
        <h1 id="question">System Overload: Emotional capacity at 100%.<br>Will you be my girlfriend?</h1>
        <div class="btn-container">
            <button id="yesBtn">EXECUTE "YES.EXE"</button>
            <button id="noBtn">CANCEL</button>
        </div>
    </div>

    <!-- Stage 3: Success -->
    <div id="success" class="hidden">
        <div id="finalMessage"></div>
    </div>

    <script>
        const text = [
            "> Initializing connection...",
            "> Bypassing friendship firewall...",
            "> Analyzing compatibility... 99.9%",
            "> ERROR: Feelings cannot be contained.",
            "> Enter passcode (Hint: The day we met/Your birthday/or just 'love'):"
        ];

        let line = 0;
        let char = 0;
        const speed = 40;
        const terminal = document.getElementById('typewriter');

        function type() {
            if (line < text.length) {
                if (char < text[line].length) {
                    terminal.innerHTML += text[line].charAt(char);
                    char++;
                    setTimeout(type, speed);
                } else {
                    terminal.innerHTML += "<br>";
                    line++;
                    char = 0;
                    setTimeout(type, 800);
                }
            } else {
                document.getElementById('inputArea').style.display = 'block';
                document.getElementById('passcode').focus();
            }
        }

        // Passcode Logic
        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('terminal').style.display = 'none';
                document.getElementById('cursor').style.display = 'none';
                document.getElementById('proposal').style.display = 'block';
            }
        });

        // The No Button Logic - "The Growth"
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        let yesSize = 1;

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('click', moveNo);

        function moveNo() {
            // Move NO
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Grow YES
            yesSize += 0.4;
            yesBtn.style.transform = `scale(${yesSize})`;
            
            // Change text of NO button randomly
            const excuses = ["Are you sure?", "Think again!", "System Error", "Wait!", "Not an option"];
            noBtn.innerText = excuses[Math.floor(Math.random() * excuses.length)];
        }

        // Success Logic
        yesBtn.addEventListener('click', () => {
            document.getElementById('proposal').classList.add('hidden');
            document.body.style.background = '#ff2d55';
            const successDiv = document.getElementById('success');
            successDiv.classList.remove('hidden');
            successDiv.style.textAlign = 'center';
            successDiv.style.color = 'white';
            successDiv.innerHTML = "<h1>Dating Mode: ACTIVATED ❤️</h1><p>Welcome to the best decision of your life.</p>";
        });

        window.onload = type;
    </script>
</body>
</html>
