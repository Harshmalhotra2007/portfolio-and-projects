name: Daily Auto Commit

on:
  schedule:
    # Runs at 12:00 UTC (5:30 PM IST) every day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make a change
      run: |
        echo "Last auto-contribution: $(date)" > last_contribution.txt

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_contribution.txt
        git commit -m "chore: daily automatic contribution update"
        git push
